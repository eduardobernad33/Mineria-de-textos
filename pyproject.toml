[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eonlp"
version = "0.1.0"
description = "Librería NLP basada en reglas para Esperanto (tokenización, lematización, POS, stop-words)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Eduardo Bernad Soria" },
    { name = "Gonzalo Olivares" },
    { name = "Pedro Riveiro" },
]
# La librería no depende de ninguna otra: está hecha desde cero.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eonlp = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
