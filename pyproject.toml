[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eonlp"
version = "0.1.0"
description = "Librería NLP basada en reglas para Esperanto (tokenización, lematización, POS, stop-words)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Eduardo Bernad Soria" },
    { name = "Compañero 2" },
    { name = "Compañero 3" },
]
# La librería NLP no depende de ninguna librería externa (requisito: construida desde 0).
dependencies = []

[project.optional-dependencies]
# Dependencias para generar el dataset (script) — no las necesita la librería.
data = ["requests>=2.31", "beautifulsoup4>=4.12", "pandas>=2.0"]
# Dependencias de desarrollo.
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eonlp = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
